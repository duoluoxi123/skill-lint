[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-lint"
version = "0.1.0"
description = "A fast linter and validator for agent Skills (SKILL.md) and AGENTS.md files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Haichao Zhang" }]
keywords = [
  "agents",
  "agent-skills",
  "skills",
  "codex",
  "claude",
  "linter",
  "AGENTS.md",
  "SKILL.md",
  "ai",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/duoluoxi123/skill-lint"
Repository = "https://github.com/duoluoxi123/skill-lint"
Issues = "https://github.com/duoluoxi123/skill-lint/issues"

[project.scripts]
skill-lint = "skill_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
